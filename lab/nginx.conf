# ==============================================================================
# PS-028 Happy Eyeballs Measurement Lab: Nginx Server Configuration
# Work Package A2: Server Configuration and Test Endpoint
#
# Documented Nginx Prefix Usage:
# Relative paths in this configuration (root, access_log, error_log)
# are resolved relative to the Nginx prefix directory (-p).
#
# The documented prefix for this project is the repository root directory
# (or deployed prefix /usr/local/libexec/ps028).
# This ensures that when the repository is cloned to any directory or host,
# paths remain valid without requiring hardcoded user-home or system paths.
#
# PID Ownership & Runtime Lifecycle:
# The PID directive is intentionally omitted from this static configuration file
# to prevent duplicate directive collisions with runtime launchers.
# The single authoritative production PID path is /run/ps028/nginx.pid,
# injected exclusively at startup by the privileged helper launcher
# (start_nginx_privileged in lab/privileged_helper.py) via the -g option.
#
# Commands:
#   1. Configuration Syntax Test (Unprivileged, from repository root):
#      nginx -t -p "$PWD/" -c lab/nginx.conf -g "pid /tmp/nginx.pid; error_log lab/error.log info;"
#
#   2. Runtime Execution (Inside the ps028-sv network namespace via privileged helper):
#      sudo ./lab/privileged_helper.py start-nginx
#      (Launcher injects -g "pid /run/ps028/nginx.pid; error_log /var/log/ps028/nginx_error.log info; user ps028-sv;")
#
#   3. Stop Nginx Process (Via privileged helper):
#      sudo ./lab/privileged_helper.py stop-nginx
# ==============================================================================

# Error log path relative to project prefix (-p).
# Production runtime overrides this to /var/log/ps028/nginx_error.log via launcher -g option.
error_log lab/error.log info;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/plain                            txt;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
    }
    default_type text/html;
    charset utf-8;

    # PS-028 Happy Eyeballs Measurement Log Format
    # Logs the following fields for every request:
    #   1. Millisecond timestamp ($msec)
    #   2. Remote client address  ($remote_addr)
    #   3. Local server address   ($server_addr)
    #   4. HTTP request line      ("$request")
    #   5. HTTP status code       ($status)
    log_format ps028_measurement '$msec $remote_addr $server_addr "$request" $status';

    access_log lab/access.log ps028_measurement;

    sendfile on;
    keepalive_timeout 0;

    # Measurement Server
    server {
        # Listen on IPv4 and IPv6 measurement endpoints
        listen 10.0.2.10:80;
        listen [2001:db8:2::10]:80;
        server_name _;

        # Project-relative document root
        root lab/www;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
