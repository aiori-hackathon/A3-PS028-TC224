# ==============================================================================
# PS-028 Happy Eyeballs Measurement Lab: Nginx Server Configuration
# Work Package A2: Server Configuration and Test Endpoint
#
# Documented Nginx Prefix Usage:
# All relative paths in this configuration (root, pid, access_log, error_log)
# are resolved relative to the Nginx prefix directory (-p).
#
# The documented prefix for this project is the repository root directory.
# This ensures that when the repository is cloned to any directory or host,
# paths remain valid without requiring hardcoded user-home or system paths.
#
# Commands:
#   1. Configuration Syntax Test (Unprivileged, from repository root):
#      nginx -t -p . -c lab/nginx.conf
#
#   2. Runtime Execution (Inside the ps028-sv network namespace):
#      sudo ip netns exec ps028-sv \
#        nginx -p "$PWD/" -c lab/nginx.conf \
#        -g "user $(id -un);"
#
#   3. Stop Nginx Process:
#      sudo ip netns exec ps028-sv nginx -p "$PWD" -c lab/nginx.conf -s stop
# ==============================================================================

# Keep PID and logs isolated within the project lab directory,
# completely separate from /etc/nginx, /var/log/nginx, and /run/nginx.pid.
pid lab/nginx.pid;
error_log lab/error.log info;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/plain                            txt;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
    }
    default_type text/html;
    charset utf-8;

    # PS-028 Happy Eyeballs Measurement Log Format
    # Logs the following fields for every request:
    #   1. Millisecond timestamp ($msec)
    #   2. Remote client address  ($remote_addr)
    #   3. Local server address   ($server_addr)
    #   4. HTTP request line      ("$request")
    #   5. HTTP status code       ($status)
    log_format ps028_measurement '$msec $remote_addr $server_addr "$request" $status';

    access_log lab/access.log ps028_measurement;

    sendfile on;
    keepalive_timeout 65;

    # Measurement Server
    server {
        # Listen on IPv4 and IPv6 measurement endpoints
        listen 10.0.2.10:80;
        listen [2001:db8:2::10]:80;
        server_name _;

        # Project-relative document root
        root lab/www;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
