- name: Install tshark
  ansible.builtin.apt:
    name: tshark
    state: present

- name: Copy packet-capture tshark systemd service file
  ansible.builtin.template:
    src: 'he-packet-capture-tshark.service.j2'
    dest: '/etc/systemd/system/he-packet-capture-tshark.service'
    owner: root
    group: root
    mode: '0644'
  notify: restart he-packet-capture-tshark

- name: Ensure tshark service is started
  ansible.builtin.systemd:
    name: 'he-packet-capture-tshark.service'
    state: started
    enabled: true
    daemon_reload: true
