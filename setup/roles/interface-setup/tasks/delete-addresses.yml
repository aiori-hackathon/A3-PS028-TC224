    - '{{ happy_eyeballs.nameserver.ipv6 }}'

- name: Delete IPv4 address from webtester interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ happy_eyeballs.webtester.ipv4 }}/{{ happy_eyeballs.webtester.ipv4_net_mask }} dev {{ happy_eyeballs.webtester.interface }}'
  failed_when: false

- name: Delete IPv6 address from webtester interface
  ansible.builtin.shell:
    cmd: 'ip a del {{ happy_eyeballs.webtester.ipv6 }}/{{ happy_eyeballs.webtester.ipv6_net_mask }} dev {{ happy_eyeballs.webtester.interface }}'
